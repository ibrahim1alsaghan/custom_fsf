# FSF branded error pages -- nginx layer.
#
# Goal: no nginx-generated page ever reaches a visitor. The stock pages print
# "nginx/<version>" in their footer (information disclosure), and even with
# `server_tokens off` they still print "nginx". Replacing them removes the
# product name and the version together.
#
# Include this file once inside the *server* block of the erpnext-nginx config.
#
# IMPORTANT -- do NOT deploy this the way fsf-security.conf is deployed.
# That file is dropped into /etc/nginx/conf.d/, which nginx globs into the
# *http* context. This file contains `location` blocks, and `location` is
# illegal in the http context -- `nginx -t` will fail with
# "location directive is not allowed here" and the container will not start.
#
# Put it somewhere OUTSIDE the conf.d/*.conf glob, e.g.
#   COPY deployment/nginx/fsf-error-pages.conf /etc/nginx/snippets/fsf-error-pages.conf
# and reference it from inside the server block of the site config:
#   server {
#       ...
#       include /etc/nginx/snippets/fsf-error-pages.conf;
#   }
#
# Pages served (both live on the assets volume, so they render with the Python
# backend completely down, and neither names any server software):
#   custom_fsf/public/error/error.html -> /assets/custom_fsf/error/error.html
#   custom_fsf/public/error/502.html   -> /assets/custom_fsf/error/502.html

# Keep this OFF (it is the nginx default). If it is ever turned on, nginx
# swallows the response bodies coming back from gunicorn and replaces Frappe's
# own branded 404/403/500 pages with the static pages below.
proxy_intercept_errors off;

# --- client-side errors (nginx answers these itself) ----------------------
# 404 is the important one: a missing file under /assets/ is served by nginx
# directly and never reaches the application, which is where the version
# string leaks today. No auto-retry on this page -- retrying a 404 is futile.
error_page 400 402 403 404 405 406 408 409 410 411 412 414 415 416 421 429 431 /assets/custom_fsf/error/error.html;

# Upload larger than client_max_body_size.
error_page 413 /assets/custom_fsf/error/error.html;

# --- server-side errors ---------------------------------------------------
# The "backend is not answering" cases: gunicorn restarting, pod rolling,
# readiness probe failing. This page carries the auto-retry countdown.
#
# No "=code" override, so nginx keeps the original status (502/503/504) and
# only swaps in our HTML body -- uptime monitoring and crawlers still see a
# real error rather than a 200.
error_page 500 501 502 503 504 505 /assets/custom_fsf/error/502.html;

location = /assets/custom_fsf/error/error.html {
	# Adjust if the bench lives elsewhere in the nginx image. This must be the
	# directory that *contains* the `assets/` folder -- the same root the
	# existing `location /assets` block uses.
	root /home/frappe/frappe-bench/sites;

	# Reachable via error_page internal redirects, but not directly by URL.
	# NOTE: this makes the page 404 if fetched directly, which is expected --
	# verify by triggering a real error, not by requesting this path.
	internal;

	add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
	add_header Pragma "no-cache" always;
}

location = /assets/custom_fsf/error/502.html {
	root /home/frappe/frappe-bench/sites;
	internal;

	# Never let an outage page get cached and shown after recovery.
	add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
	add_header Pragma "no-cache" always;
	add_header Retry-After 30 always;
}
